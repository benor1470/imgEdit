name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "imgEdit-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: imgEdit-apk
          path: imgEdit-*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${{ github.run_number }}" imgEdit-*.apk \
            --title "imgEdit 0.1.${{ github.run_number }}" \
            --notes "Automatic build of ${GITHUB_SHA}" \
            --target "${GITHUB_SHA}"
